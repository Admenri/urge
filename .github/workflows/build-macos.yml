name: Build macOS

on:
  push:
    branches: [master]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: build-macos-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  macos:
    name: macos-arm64
    runs-on: macos-26
    timeout-minutes: 180
    env:
      URGE_MACOS_DEPLOYMENT_TARGET: "13.3"
      CMAKE_BUILD_PARALLEL_LEVEL: "3"

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@stable

      - uses: lukka/get-cmake@latest

      - name: Xcode libclang for bindgen
        run: |
          set -euo pipefail
          libclang="$(xcode-select -p)/Toolchains/XcodeDefault.xctoolchain/usr/lib"
          test -f "$libclang/libclang.dylib"
          echo "LIBCLANG_PATH=$libclang" >> "$GITHUB_ENV"
          test "$(uname -m)" = arm64

      - name: Build native executable and app
        run: |
          set -euo pipefail
          ./app/platform/macos/build-native.sh 2>&1 | tee build-macos.log

      - name: Package
        run: |
          set -euo pipefail
          native=build/macos-native
          mkdir -p dist/game dist/app
          cp "$native/app/Game" dist/game/Game
          ditto "$native/URGE.app" dist/app/URGE.app
          for package in game app; do
            cp LICENSE.txt "dist/$package/"
            ditto "$native/licenses" "dist/$package/licenses"
          done
          # Archive before uploading so executable modes and the signed bundle
          # survive artifact download and extraction.
          ditto -c -k --sequesterRsrc dist/game dist/urge-macos-arm64-game.zip
          ditto -c -k --sequesterRsrc dist/app dist/urge-macos-arm64-app.zip

      - name: Verify archives
        run: |
          set -euo pipefail
          check=build/macos-artifact-check
          mkdir -p "$check/game" "$check/app"
          ditto -x -k dist/urge-macos-arm64-game.zip "$check/game"
          ditto -x -k dist/urge-macos-arm64-app.zip "$check/app"
          test -x "$check/game/Game"
          test -x "$check/app/URGE.app/Contents/MacOS/Game"
          cmp build/macos-native/app/Game "$check/game/Game"
          codesign --verify --strict --verbose=2 "$check/game/Game"
          codesign --verify --deep --strict --verbose=2 "$check/app/URGE.app"

      - uses: actions/upload-artifact@v7
        with:
          path: dist/urge-macos-arm64-game.zip
          archive: false
          if-no-files-found: error
          retention-days: 14

      - uses: actions/upload-artifact@v7
        with:
          path: dist/urge-macos-arm64-app.zip
          archive: false
          if-no-files-found: error
          retention-days: 14

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: macos-native-build-log
          path: build-macos.log
          retention-days: 7
