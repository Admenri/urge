name: Build

on:
  push:
    branches: [master]
  # Tag builds happen through release.yml, which calls these jobs and then
  # attaches the artifacts to the release.
  workflow_call:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows:
    name: windows-amd64
    runs-on: windows-latest
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Python packages
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      # wgpu-native is built by Corrosion, which drives cargo.
      - uses: dtolnay/rust-toolchain@stable

      - uses: lukka/get-cmake@latest

      - name: Configure
        shell: pwsh
        run: |
          # The presets pin "Visual Studio 18 2026"; older images still carry
          # Visual Studio 17, so pick whichever the machine actually has.
          $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio\Installer\vswhere.exe"
          $generator = "Visual Studio 17 2022"
          if (Test-Path $vswhere) {
            $line = & $vswhere -latest -products * -property catalog_productLineVersion
            if ($line -match "^18") { $generator = "Visual Studio 18 2026" }
          }
          Write-Host "URGE: generator = $generator"
          cmake -S . -B build/ci -G $generator -A x64 -DCMAKE_BUILD_TYPE=RelWithDebInfo

      - name: Build
        run: cmake --build build/ci --config RelWithDebInfo --target Game

      - name: Stage
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item build/ci/app/RelWithDebInfo/Game.exe dist/urge-windows-x64.exe
          Copy-Item build/ci/app/audio-codec-licenses.txt dist/audio-codec-licenses.txt
          Copy-Item build/ci/app/ruby-encoding-licenses.txt dist/ruby-encoding-licenses.txt

      - uses: actions/upload-artifact@v7
        with:
          name: urge-windows-amd64
          path: dist/
          if-no-files-found: error
          retention-days: 14

  linux:
    name: linux-amd64
    runs-on: ubuntu-24.04
    # Only CI uses this sysroot/toolchain; local presets stay distribution-native.
    container:
      image: quay.io/pypa/manylinux_2_28_x86_64:latest
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    env:
      CC: gcc
      CXX: g++
      CMAKE_BUILD_PARALLEL_LEVEL: "3"
      LIBGL_ALWAYS_SOFTWARE: "1"
      # EL8 disables its software Vulkan driver unless explicitly requested.
      RH_SW_VULKAN: "1"

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Verify build environment
        run: |
          set -euo pipefail
          test "$(uname -m)" = x86_64
          test "$(getconf GNU_LIBC_VERSION)" = 'glibc 2.28'
          gcc --version
          cmake --version
          echo /opt/python/cp312-cp312/bin >> "$GITHUB_PATH"

      - name: Native dependencies
        run: |
          set -euo pipefail
          dnf install -y nasm pkgconf-pkg-config clang openssl3-devel \
            zlib-devel alsa-lib-devel pulseaudio-libs-devel libX11-devel \
            libXcursor-devel libXext-devel libXi-devel libXrandr-devel \
            libXScrnSaver-devel libXtst-devel wayland-devel libxkbcommon-devel \
            libdrm-devel mesa-libgbm-devel mesa-libEGL-devel libpng-devel \
            libtiff-devel xorg-x11-server-Xvfb xorg-x11-xauth \
            vulkan-loader mesa-vulkan-drivers mesa-dri-drivers mesa-libGL

      - uses: dtolnay/rust-toolchain@stable

      - name: Python packages
        run: python -m pip install --disable-pip-version-check -r requirements.txt ninja

      - name: CI image codecs
        run: |
          set -euo pipefail
          prefix="$RUNNER_TEMP/urge-image-deps"
          bash .github/scripts/linux-image-deps.sh "$GITHUB_WORKSPACE" \
            "$RUNNER_TEMP/urge-image-deps-build" "$prefix"
          echo "CMAKE_PREFIX_PATH=$prefix" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_PATH=$prefix/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}" >> "$GITHUB_ENV"
          echo "URGE_CI_IMAGE_DEPS=$prefix" >> "$GITHUB_ENV"

      - name: Configure
        run: |
          cmake --preset linux-amd64 -DSDLIMAGE_DEPS_SHARED=OFF \
            -DSDLIMAGE_PNG_SHARED=OFF -DSDLIMAGE_TIF_SHARED=OFF \
            -DSDLIMAGE_AVIF_SHARED=OFF -DSDLIMAGE_STRICT=ON \
            -DOPENSSL_INCLUDE_DIR=/usr/include/openssl3 \
            -DOPENSSL_SSL_LIBRARY=/usr/lib64/openssl3/libssl.so \
            -DOPENSSL_CRYPTO_LIBRARY=/usr/lib64/openssl3/libcrypto.so

      - name: Build native executable
        run: |
          set -euo pipefail
          cmake --build --preset linux-amd64 2>&1 | tee build-linux.log

      - name: Package and verify
        run: |
          set -euo pipefail
          native=build/linux-amd64
          package=dist/urge-linux-amd64
          mkdir -p "$package/licenses"
          install -m 755 "$native/app/Game" "$package/Game"
          # Strip the distribution copy only; preserve build-tree debug info.
          strip --strip-unneeded "$package/Game"
          cp LICENSE.txt "$package/"
          cp app/platform/linux/README.md "$package/README.md"
          cp "$native/app/audio-codec-licenses.txt" "$package/licenses/"
          cp "$native/app/ruby-encoding-licenses.txt" "$package/licenses/"
          for item in \
            'third_party/SDL/LICENSE.txt:sdl.txt' \
            'third_party/SDL_image/LICENSE.txt:sdl-image.txt' \
            'third_party/SDL/src/video/yuv2rgb/LICENSE:sdl-yuv.txt' \
            'third_party/miniaudio/LICENSE:miniaudio.txt' \
            'third_party/SDL_image/external/libwebp/COPYING:webp.txt' \
            'third_party/SDL_ttf/external/freetype/LICENSE.TXT:freetype-license.txt' \
            'third_party/SDL_ttf/external/freetype/docs/FTL.TXT:freetype.txt' \
            'third_party/SDL_ttf/external/freetype/docs/GPLv2.TXT:freetype-gpl.txt' \
            'third_party/physfs/LICENSE.txt:physfs.txt' \
            'third_party/ruby/COPYING:ruby.txt' \
            'third_party/ruby/BSDL:ruby-bsd.txt' \
            'third_party/wgpu-cmake/wgpu-native/LICENSE.MIT:wgpu-mit.txt' \
            'third_party/wgpu-cmake/wgpu-native/LICENSE.APACHE:wgpu-apache.txt' \
            'third_party/wgpu-cmake/wgpu-native/ffi/webgpu-headers/LICENSE:webgpu-headers.txt' \
            'third_party/imgui/LICENSE.txt:imgui.txt' \
            'third_party/glm/copying.txt:glm.txt' \
            'third_party/zlib/LICENSE:zlib.txt' \
            'third_party/curl/COPYING:curl.txt' \
            'third_party/dav1d/COPYING:dav1d.txt' \
            'third_party/webm/LICENSE.TXT:webm.txt' \
            'third_party/monocypher/monocypher.h:monocypher.txt'; do
            cp "${item%%:*}" "$package/licenses/${item#*:}"
          done
          cp "$URGE_CI_IMAGE_DEPS/licenses/"* "$package/licenses/"
          tar -czf dist/urge-linux-amd64.tar.gz -C dist urge-linux-amd64
          check=build/linux-artifact-check
          mkdir -p "$check"
          tar -xzf dist/urge-linux-amd64.tar.gz -C "$check"
          test -x "$check/urge-linux-amd64/Game"
          cmp "$package/Game" "$check/urge-linux-amd64/Game"
          file "$check/urge-linux-amd64/Game"
          # Inspect the artifact as well as the build host: no newer glibc
          # symbol may enter through a compiler or a prebuilt dependency.
          readelf --version-info "$check/urge-linux-amd64/Game" \
            | grep -oE 'GLIBC_[0-9]+(\.[0-9]+)+' | sort -Vu \
            | tee build/linux-glibc-versions.txt
          newest="$(sed 's/^GLIBC_//' build/linux-glibc-versions.txt | sort -V | tail -n1)"
          test -n "$newest"
          test "$(printf '%s\n' "$newest" 2.28 | sort -V | tail -n1)" = 2.28
          ldd "$check/urge-linux-amd64/Game" | tee build/linux-runtime-libraries.txt
          if grep -q 'not found' build/linux-runtime-libraries.txt; then exit 1; fi

      - name: Software Vulkan runtime
        run: |
          set -euo pipefail
          # Mesa's filename differs between distributions/revisions.
          icds=(/usr/share/vulkan/icd.d/lvp_icd*.json)
          test -f "${icds[0]}"
          echo "VK_DRIVER_FILES=${icds[0]}" >> "$GITHUB_ENV"
          echo "VK_ICD_FILENAMES=${icds[0]}" >> "$GITHUB_ENV"
          runtime="$RUNNER_TEMP/urge-xdg-runtime"
          mkdir -p "$runtime"
          chmod 700 "$runtime"
          echo "XDG_RUNTIME_DIR=$runtime" >> "$GITHUB_ENV"

      - name: Test packaged executable
        run: |
          set -euo pipefail
          engine=build/linux-artifact-check/urge-linux-amd64/Game
          xvfb-run -a python tools/tests/gpu/run.py --engine "$engine" --backend vulkan
          xvfb-run -a python tools/tests/gpu/run.py --engine "$engine" --backend opengl
          xvfb-run -a python tools/tests/network/run.py --engine "$engine" --backend vulkan

      - uses: actions/upload-artifact@v7
        with:
          name: urge-linux-amd64
          path: dist/urge-linux-amd64.tar.gz
          if-no-files-found: error
          retention-days: 14

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: linux-native-build-log
          path: |
            build-linux.log
            build/linux-runtime-libraries.txt
            build/linux-glibc-versions.txt
            build/gpu-integration/**/engine-output.txt
            build/gpu-integration/**/gpu-results.txt
            build/gpu-integration/**/Game.log
            build/network-integration/**/engine-output.txt
            build/network-integration/**/network-results.txt
            build/network-integration/**/Game.log
          retention-days: 7

  macos:
    name: macos-arm64
    runs-on: macos-26
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    env:
      URGE_MACOS_DEPLOYMENT_TARGET: "13.3"
      CMAKE_BUILD_PARALLEL_LEVEL: "3"

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@stable

      - uses: lukka/get-cmake@latest

      - name: Xcode libclang for bindgen
        run: |
          set -euo pipefail
          libclang="$(xcode-select -p)/Toolchains/XcodeDefault.xctoolchain/usr/lib"
          test -f "$libclang/libclang.dylib"
          echo "LIBCLANG_PATH=$libclang" >> "$GITHUB_ENV"
          test "$(uname -m)" = arm64

      - name: Build native executable and app
        run: |
          set -euo pipefail
          ./app/platform/macos/build-native.sh 2>&1 | tee build-macos.log

      - name: Package
        run: |
          set -euo pipefail
          native=build/macos-native
          mkdir -p dist/game dist/app
          cp "$native/app/Game" dist/game/Game
          ditto "$native/URGE.app" dist/app/URGE.app
          for package in game app; do
            cp LICENSE.txt "dist/$package/"
            ditto "$native/licenses" "dist/$package/licenses"
          done
          # Archive before uploading so executable modes and the signed bundle
          # survive artifact download and extraction.
          ditto -c -k --sequesterRsrc dist/game dist/urge-macos-arm64-game.zip
          ditto -c -k --sequesterRsrc dist/app dist/urge-macos-arm64-app.zip

      - name: Verify archives
        run: |
          set -euo pipefail
          check=build/macos-artifact-check
          mkdir -p "$check/game" "$check/app"
          ditto -x -k dist/urge-macos-arm64-game.zip "$check/game"
          ditto -x -k dist/urge-macos-arm64-app.zip "$check/app"
          test -x "$check/game/Game"
          test -x "$check/app/URGE.app/Contents/MacOS/Game"
          cmp build/macos-native/app/Game "$check/game/Game"
          codesign --verify --strict --verbose=2 "$check/game/Game"
          codesign --verify --deep --strict --verbose=2 "$check/app/URGE.app"

      - uses: actions/upload-artifact@v7
        with:
          name: urge-macos-arm64
          path: |
            dist/urge-macos-arm64-game.zip
            dist/urge-macos-arm64-app.zip
          if-no-files-found: error
          retention-days: 14

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: macos-native-build-log
          path: build-macos.log
          retention-days: 7

  wasm:
    name: emscripten-wasm32
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      # Pin the SDK and share its cache across push and release workflows.
      EMSDK_VERSION: "7.0.1"

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Python packages
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - uses: emscripten-core/setup-emsdk@v16
        with:
          version: ${{ env.EMSDK_VERSION }}
          actions-cache-folder: emsdk-cache
          cache-key: urge-emsdk-${{ env.EMSDK_VERSION }}-${{ runner.os }}-${{ runner.arch }}

      - name: Verify Emscripten version
        run: emcc --version

      - uses: lukka/get-cmake@latest

      - name: Configure
        run: cmake --preset emscripten-wasm32

      - name: Build
        run: cmake --build --preset emscripten-wasm32

      - name: Package
        run: |
          set -euo pipefail
          out=build/emscripten-wasm32/app
          mkdir -p dist/tools
          cp "$out/Game.html" "$out/Game.js" "$out/Game.wasm" \
             "$out/urge-helper.js" "$out/async_mapping.js" dist/
          cp "$out/audio-codec-licenses.txt" dist/
          cp "$out/ruby-encoding-licenses.txt" dist/
          cp tools/build_mapping.py dist/tools/
          cat > dist/README.txt <<'EOF'
          URGE web build
          ==============

          Serve this directory over HTTP (WebGPU needs a secure context;
          localhost counts).  Open Game.html and drop the game's files in the
          page, or publish a game directory beside the module:

              python tools/build_mapping.py --input <game dir> --output async_mapping.js

          async_mapping.js indexes the assets so the module can fetch them on
          demand; the bundled one is empty.
          EOF
          (cd dist && zip -9 -r ../urge-emscripten-wasm32.zip .)

      - uses: actions/upload-artifact@v7
        with:
          name: urge-emscripten-wasm32
          path: urge-emscripten-wasm32.zip
          if-no-files-found: error
          retention-days: 14

  android:
    name: android-aarch64
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Python packages
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: lukka/get-cmake@latest

      - name: Android SDK packages
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [ -z "${ANDROID_HOME:-}" ]; then
            echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          fi
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK" -path '*/cmdline-tools/*/bin/sdkmanager' | head -n 1 || true)"
          fi
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager was not found under $SDK" >&2
            exit 1
          fi

          # The license prompt is interactive and closes the pipe early; the
          # redirect keeps yes' SIGPIPE notice out of the log.
          (yes | "$SDKMANAGER" --licenses) >/dev/null 2>&1 || true

          # Prefer what the image already carries.  Asking the repository for a
          # brand-new platform is what previously made sdkmanager advertise
          # package 37 and then refuse to install it.
          INSTALLED="$("$SDKMANAGER" --list_installed 2>/dev/null || true)"
          COMPILE_SDK="$(printf '%s\n' "$INSTALLED" \
            | grep -oE 'platforms;android-[0-9]+' \
            | sed 's/.*android-//' | sort -n | tail -n 1 || true)"
          INSTALLED_BUILD_TOOLS="$(printf '%s\n' "$INSTALLED" \
            | grep -oE 'build-tools;[0-9]+\.[0-9]+\.[0-9]+' \
            | sed 's/build-tools;//' | sort -V | tail -n 1 || true)"

          # A bare image: install the project's target, newest first.
          if [ -z "$COMPILE_SDK" ]; then
            for candidate in 37 36 35; do
              if "$SDKMANAGER" "platforms;android-$candidate" >/dev/null 2>&1 \
                 || "$SDKMANAGER" --channel=3 "platforms;android-$candidate" >/dev/null 2>&1; then
                COMPILE_SDK=$candidate
                break
              fi
            done
          fi
          if [ -z "$COMPILE_SDK" ]; then
            echo "no Android platform could be installed" >&2
            exit 1
          fi

          # Keep the project's build-tools when the channel has them; otherwise
          # use the revision already installed on the image.
          BUILD_TOOLS=36.0.0
          if ! "$SDKMANAGER" "build-tools;36.0.0" >/dev/null 2>&1 \
             && ! "$SDKMANAGER" --channel=3 "build-tools;36.0.0" >/dev/null 2>&1; then
            BUILD_TOOLS="$INSTALLED_BUILD_TOOLS"
          fi
          if [ -z "$BUILD_TOOLS" ]; then
            for candidate in 36.0.0 35.0.0 34.0.0; do
              if "$SDKMANAGER" "build-tools;$candidate" >/dev/null 2>&1 \
                 || "$SDKMANAGER" --channel=3 "build-tools;$candidate" >/dev/null 2>&1; then
                BUILD_TOOLS=$candidate
                break
              fi
            done
          fi
          if [ -z "$BUILD_TOOLS" ]; then
            echo "no build-tools package could be installed" >&2
            exit 1
          fi

          echo "URGE_COMPILE_SDK=$COMPILE_SDK" >> "$GITHUB_ENV"
          echo "URGE_BUILD_TOOLS=$BUILD_TOOLS" >> "$GITHUB_ENV"
          echo "URGE: compileSdk=$COMPILE_SDK buildTools=$BUILD_TOOLS"

      # NDK r27's Linux prebuilt no longer carries libclang.so; bindgen needs a
      # host one to parse wgpu's C headers.
      - name: libclang for bindgen
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libclang-dev
          LIBCLANG_FILE="$(find /usr/lib/llvm-* -name 'libclang.so*' 2>/dev/null \
            | sort -V | tail -n 1 || true)"
          if [ -z "$LIBCLANG_FILE" ]; then
            LIBCLANG_FILE="$(find /usr/lib -name 'libclang.so*' 2>/dev/null \
              | sort -V | tail -n 1 || true)"
          fi
          if [ -z "$LIBCLANG_FILE" ]; then
            echo "no system libclang found" >&2
            exit 1
          fi
          echo "LIBCLANG_PATH=$(dirname "$LIBCLANG_FILE")" >> "$GITHUB_ENV"
          echo "URGE: LIBCLANG_PATH=$(dirname "$LIBCLANG_FILE")"

      - name: Configure
        run: cmake --preset android-arm64

      - name: Build native
        run: |
          set -o pipefail
          set +e
          cmake --build --preset android-arm64 2>&1 \
            | tee build-android.log \
            | grep -vE 'warning:|note:|warnings? generated|In file included from|^[[:space:]]*[0-9]+ \||^[[:space:]]*\^|^[[:space:]]*\|'
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            echo "::group::Errors from the native build"
            grep -nE 'error:|FAILED:|panicked at|fatal error|Unable to find' \
              build-android.log | tail -60 || true
            echo "::endgroup::"
          fi
          exit "$status"

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: android-native-build-log
          path: build-android.log
          retention-days: 7

      - name: Build APK
        run: |
          set -euo pipefail
          # .gitattributes checks the wrapper out with CRLF outside Windows.
          sed -i 's/\r$//' android/gradlew
          chmod +x android/gradlew
          cd android
          ./gradlew --no-daemon assembleDebug \
            -PurgeCompileSdk="$URGE_COMPILE_SDK" \
            -PurgeBuildToolsVersion="$URGE_BUILD_TOOLS"

      - name: Stage
        run: |
          set -euo pipefail
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk \
             dist/urge-android-aarch64.apk

      - uses: actions/upload-artifact@v7
        with:
          name: urge-android-aarch64
          path: dist/urge-android-aarch64.apk
          if-no-files-found: error
          retention-days: 14
