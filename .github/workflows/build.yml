name: Build

on:
  push:
    branches: [master]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows:
    name: windows-amd64
    runs-on: windows-latest
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Python packages
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      # wgpu-native is built by Corrosion, which drives cargo.
      - uses: dtolnay/rust-toolchain@stable

      - uses: lukka/get-cmake@latest

      - name: Configure
        shell: pwsh
        run: |
          # The presets pin "Visual Studio 18 2026"; older images still carry
          # Visual Studio 17, so pick whichever the machine actually has.
          $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio\Installer\vswhere.exe"
          $generator = "Visual Studio 17 2022"
          if (Test-Path $vswhere) {
            $line = & $vswhere -latest -products * -property catalog_productLineVersion
            if ($line -match "^18") { $generator = "Visual Studio 18 2026" }
          }
          Write-Host "URGE: generator = $generator"
          cmake -S . -B build/ci -G $generator -A x64 -DCMAKE_BUILD_TYPE=RelWithDebInfo

      - name: Build
        run: cmake --build build/ci --config RelWithDebInfo --target Game

      - name: Stage
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item build/ci/app/RelWithDebInfo/Game.exe dist/urge-windows-x64.exe

      - uses: actions/upload-artifact@v7
        with:
          name: urge-windows-amd64
          path: dist/urge-windows-x64.exe
          if-no-files-found: error
          retention-days: 14

  wasm:
    name: emscripten-wasm32
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Python packages
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - uses: emscripten-core/setup-emsdk@v16
        with:
          version: latest
          actions-cache-folder: emsdk-cache

      - uses: lukka/get-cmake@latest

      - name: Configure
        run: cmake --preset emscripten-wasm32

      - name: Build
        run: cmake --build --preset emscripten-wasm32

      - name: Package
        run: |
          set -euo pipefail
          out=build/emscripten-wasm32/app
          mkdir -p dist/tools
          cp "$out/Game.html" "$out/Game.js" "$out/Game.wasm" \
             "$out/urge-helper.js" "$out/async_mapping.js" dist/
          cp app/build_mapping.py dist/tools/
          cat > dist/README.txt <<'EOF'
          URGE web build
          ==============

          Serve this directory over HTTP (WebGPU needs a secure context;
          localhost counts).  Open Game.html and drop the game's files in the
          page, or publish a game directory beside the module:

              python tools/build_mapping.py --input <game dir> --output async_mapping.js

          async_mapping.js indexes the assets so the module can fetch them on
          demand; the bundled one is empty.
          EOF
          (cd dist && zip -9 -r ../urge-emscripten-wasm32.zip .)

      - uses: actions/upload-artifact@v7
        with:
          name: urge-emscripten-wasm32
          path: urge-emscripten-wasm32.zip
          if-no-files-found: error
          retention-days: 14

  android:
    name: android-aarch64
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Python packages
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: lukka/get-cmake@latest

      - name: Android SDK packages
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [ -z "${ANDROID_HOME:-}" ]; then
            echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          fi
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK" -path '*/cmdline-tools/*/bin/sdkmanager' | head -n 1 || true)"
          fi
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager was not found under $SDK" >&2
            exit 1
          fi

          # The license prompt is interactive and closes the pipe early; the
          # redirect keeps yes' SIGPIPE notice out of the log.
          (yes | "$SDKMANAGER" --licenses) >/dev/null 2>&1 || true

          # Prefer what the image already carries.  Asking the repository for a
          # brand-new platform is what previously made sdkmanager advertise
          # package 37 and then refuse to install it.
          INSTALLED="$("$SDKMANAGER" --list_installed 2>/dev/null || true)"
          COMPILE_SDK="$(printf '%s\n' "$INSTALLED" \
            | grep -oE 'platforms;android-[0-9]+' \
            | sed 's/.*android-//' | sort -n | tail -n 1 || true)"
          INSTALLED_BUILD_TOOLS="$(printf '%s\n' "$INSTALLED" \
            | grep -oE 'build-tools;[0-9]+\.[0-9]+\.[0-9]+' \
            | sed 's/build-tools;//' | sort -V | tail -n 1 || true)"

          # A bare image: install the project's target, newest first.
          if [ -z "$COMPILE_SDK" ]; then
            for candidate in 37 36 35; do
              if "$SDKMANAGER" "platforms;android-$candidate" >/dev/null 2>&1 \
                 || "$SDKMANAGER" --channel=3 "platforms;android-$candidate" >/dev/null 2>&1; then
                COMPILE_SDK=$candidate
                break
              fi
            done
          fi
          if [ -z "$COMPILE_SDK" ]; then
            echo "no Android platform could be installed" >&2
            exit 1
          fi

          # Keep the project's build-tools when the channel has them; otherwise
          # use the revision already installed on the image.
          BUILD_TOOLS=36.0.0
          if ! "$SDKMANAGER" "build-tools;36.0.0" >/dev/null 2>&1 \
             && ! "$SDKMANAGER" --channel=3 "build-tools;36.0.0" >/dev/null 2>&1; then
            BUILD_TOOLS="$INSTALLED_BUILD_TOOLS"
          fi
          if [ -z "$BUILD_TOOLS" ]; then
            for candidate in 36.0.0 35.0.0 34.0.0; do
              if "$SDKMANAGER" "build-tools;$candidate" >/dev/null 2>&1 \
                 || "$SDKMANAGER" --channel=3 "build-tools;$candidate" >/dev/null 2>&1; then
                BUILD_TOOLS=$candidate
                break
              fi
            done
          fi
          if [ -z "$BUILD_TOOLS" ]; then
            echo "no build-tools package could be installed" >&2
            exit 1
          fi

          echo "URGE_COMPILE_SDK=$COMPILE_SDK" >> "$GITHUB_ENV"
          echo "URGE_BUILD_TOOLS=$BUILD_TOOLS" >> "$GITHUB_ENV"
          echo "URGE: compileSdk=$COMPILE_SDK buildTools=$BUILD_TOOLS"

      # NDK r27's Linux prebuilt no longer carries libclang.so; bindgen needs a
      # host one to parse wgpu's C headers.
      - name: libclang for bindgen
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libclang-dev
          LIBCLANG_FILE="$(find /usr/lib/llvm-* -name 'libclang.so*' 2>/dev/null \
            | sort -V | tail -n 1 || true)"
          if [ -z "$LIBCLANG_FILE" ]; then
            LIBCLANG_FILE="$(find /usr/lib -name 'libclang.so*' 2>/dev/null \
              | sort -V | tail -n 1 || true)"
          fi
          if [ -z "$LIBCLANG_FILE" ]; then
            echo "no system libclang found" >&2
            exit 1
          fi
          echo "LIBCLANG_PATH=$(dirname "$LIBCLANG_FILE")" >> "$GITHUB_ENV"
          echo "URGE: LIBCLANG_PATH=$(dirname "$LIBCLANG_FILE")"

      - name: Configure
        run: cmake --preset android-arm64

      - name: Build native
        run: |
          set -o pipefail
          set +e
          cmake --build --preset android-arm64 2>&1 \
            | tee build-android.log \
            | grep -vE 'warning:|note:|warnings? generated|In file included from|^[[:space:]]*[0-9]+ \||^[[:space:]]*\^|^[[:space:]]*\|'
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            echo "::group::Errors from the native build"
            grep -nE 'error:|FAILED:|panicked at|fatal error|Unable to find' \
              build-android.log | tail -60 || true
            echo "::endgroup::"
          fi
          exit "$status"

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: android-native-build-log
          path: build-android.log
          retention-days: 7

      - name: Build APK
        run: |
          set -euo pipefail
          # .gitattributes checks the wrapper out with CRLF outside Windows.
          sed -i 's/\r$//' android/gradlew
          chmod +x android/gradlew
          cd android
          ./gradlew --no-daemon assembleDebug \
            -PurgeCompileSdk="$URGE_COMPILE_SDK" \
            -PurgeBuildToolsVersion="$URGE_BUILD_TOOLS"

      - name: Stage
        run: |
          set -euo pipefail
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk \
             dist/urge-android-aarch64.apk

      - uses: actions/upload-artifact@v7
        with:
          name: urge-android-aarch64
          path: dist/urge-android-aarch64.apk
          if-no-files-found: error
          retention-days: 14
