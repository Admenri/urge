plugins {
    id 'com.android.application'
}

// The game's own files are not copied into this project.  The directory is
// mounted as an asset source, so the APK picks them up from wherever they live:
//
//     ./gradlew assembleDebug -PurgeGameDir="J:/games/MyGame"
//
// Whatever is in that directory ends up under `assets/` in the APK, and
// URGEActivity unpacks it on the device at first launch.
def urgeGameDir = project.findProperty("urgeGameDir") ?: "../../game"

// SDL's Android side -- SDLActivity, SDLSurface, the audio and controller
// managers -- is not copied into this tree.  Its source directory is mounted as
// one more Java source root, so the classes are compiled straight out of the
// vendored SDL: updating third_party/SDL updates them, and there is no second
// copy to drift.  Only the Java is taken; the project's manifest, resources and
// gradle files are SDL's own and are not ours to build.
def sdlJavaDir = file("${rootProject.projectDir}/../third_party/SDL/android-project/app/src/main/java")
if (!sdlJavaDir.isDirectory()) {
    throw new GradleException(
        "SDL's Java sources are missing at ${sdlJavaDir}. " +
        "third_party/SDL is a submodule: run `git submodule update --init --recursive`.")
}

// Release signing.  No key material is in the tree: the four values come from
// local.properties (gitignored), from `-P` on the command line, or from the
// environment, and when any of them is missing the release APK is left
// unsigned -- signing is the one step that needs a key only the publisher has.
//
//     ./gradlew assembleRelease -PurgeStoreFile=keystore/urge-release.jks
//         -PurgeStorePassword=... -PurgeKeyAlias=urge -PurgeKeyPassword=...
def signingProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withInputStream { signingProperties.load(it) }
}

def signingValue = { String property, String environment ->
    project.findProperty(property) ?: signingProperties.getProperty(property)
            ?: System.getenv(environment)
}

def releaseStoreFile = signingValue("urgeStoreFile", "URGE_STORE_FILE")
def releaseStorePassword = signingValue("urgeStorePassword", "URGE_STORE_PASSWORD")
def releaseKeyAlias = signingValue("urgeKeyAlias", "URGE_KEY_ALIAS")
def releaseKeyPassword = signingValue("urgeKeyPassword", "URGE_KEY_PASSWORD")
def releaseKeyReady = releaseStoreFile && releaseStorePassword
        && releaseKeyAlias && releaseKeyPassword

android {
    namespace = "com.admenri.urge"
    compileSdk = 37
    buildToolsVersion = "36.0.0"

    defaultConfig {
        applicationId = "com.admenri.urge"
        // 28 is the floor the engine needs, and it is also what the native
        // build targets (ANDROID_PLATFORM=android-28), so the two agree.
        minSdk = 28
        targetSdk = 35
        // Every published APK needs a higher versionCode.  Both can be given
        // on the command line instead of edited here:
        //   ./gradlew assembleRelease -PurgeVersionCode=2 -PurgeVersionName="1.1"
        versionCode = (project.findProperty("urgeVersionCode") ?: 1) as Integer
        versionName = project.findProperty("urgeVersionName") ?: "1.0"

        // arm64 for devices, x86_64 for emulator images.  A 32-bit ABI would
        // need its own builtin_binary.rbbin (see third_party/ruby/cmake), which
        // is the only reason they are not here.
        ndk { abiFilters = ["arm64-v8a", "x86_64"] }
    }

    sourceSets {
        main {
            // Written by the `android-arm64` CMake preset, which copies
            // libmain.so and libSDL3.so here after every native build.
            jniLibs.srcDirs = ["src/main/jniLibs"]

            java.srcDirs += sdlJavaDir
        }
    }

    signingConfigs {
        // Empty when no key is configured: `buildTypes.release` only points at
        // it when all four values are present, so an unconfigured checkout
        // still produces an (unsigned) APK instead of failing the build.
        release {
            if (releaseKeyReady) {
                storeFile = rootProject.file(releaseStoreFile)
                storePassword = releaseStorePassword
                keyAlias = releaseKeyAlias
                keyPassword = releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled = false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
            if (releaseKeyReady) {
                signingConfig = signingConfigs.release
            }
        }
    }

    packaging {
        // Both libraries are already stripped by AGP; keeping the debug copies
        // out of the APK is what keeps it a download and not a download plus
        // three hundred megabytes of DWARF.
        jniLibs { useLegacyPackaging = false }
    }

    lint { abortOnError = false }
}

if (releaseKeyReady) {
    logger.lifecycle("URGE: release APK signed with ${releaseStoreFile} (alias ${releaseKeyAlias})")
} else {
    logger.lifecycle("URGE: no release key configured; assembleRelease leaves the APK unsigned")
}

def gameDir = file(urgeGameDir)
if (gameDir.isDirectory()) {
    android.sourceSets.main.assets.srcDirs += [gameDir]
    logger.lifecycle("URGE: game assets from ${gameDir}")
} else {
    logger.lifecycle("URGE: no game directory at ${gameDir}; the APK will ship without assets")
}

dependencies {
    implementation fileTree(include: ["*.jar"], dir: "libs")
}
